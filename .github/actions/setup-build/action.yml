name: Setup musl build
description: Restore this run's resolved LLVM musl toolchain, dependency, and compiler caches.

inputs:
  toolchain-release:
    description: clang-cross release resolved once for this workflow run.
    required: true
  toolchain-sha256:
    description: Official SHA256 for the resolved musl toolchain archive.
    required: true
  vcpkg-commit:
    description: Latest microsoft/vcpkg commit SHA resolved once for this workflow run.
    required: true
  compiler-cache:
    description: Compiler cache namespace; empty for assembly-only jobs.
    default: ''

outputs:
  compiler-cache-hit:
    description: Whether the exact compiler cache key was restored.
    value: ${{ steps.ccache.outputs.cache-hit }}
  compiler-cache-key:
    description: Primary compiler cache key for this job.
    value: ${{ steps.ccache.outputs.cache-primary-key }}
  vcpkg-cache-hit:
    description: Whether the exact dependency cache key was restored.
    value: ${{ steps.vcpkg-cache.outputs.cache-hit }}
  vcpkg-cache-key:
    description: Primary dependency cache key.
    value: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Ensure host parser generators for vcpkg source builds
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v bison >/dev/null || ! command -v flex >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y bison flex
        fi
        echo "VCPKG_MAX_CONCURRENCY=$(nproc)" >> "$GITHUB_ENV"

    - name: Setup mise
      uses: jdx/mise-action@v5.2.1
      with:
        install: false
        cache: false

    - name: Restore mise tools and musl toolchain cache
      id: musl-toolchain
      uses: actions/cache@v6.1.0
      with:
        path: ~/.local/share/mise/installs
        key: mise-tools-v3-${{ runner.os }}-${{ runner.arch }}-clang-cross-${{ inputs.toolchain-release }}-${{ inputs.toolchain-sha256 }}
        restore-keys: |
          mise-tools-v3-${{ runner.os }}-${{ runner.arch }}-clang-cross-${{ inputs.toolchain-release }}-
          mise-tools-v3-${{ runner.os }}-${{ runner.arch }}-

    - name: Install build tools and LLVM musl toolchain globally with mise
      shell: bash
      env:
        TOOLCHAIN_RELEASE: ${{ inputs.toolchain-release }}
        TOOLCHAIN_SHA256: ${{ inputs.toolchain-sha256 }}
        MISE_GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$TOOLCHAIN_RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]
        [[ "$TOOLCHAIN_SHA256" =~ ^[[:xdigit:]]{64}$ ]]
        mise use --global \
          cmake@latest \
          ninja@latest \
          ccache@latest \
          python@latest \
          uv@latest \
          "github:cross-tools/clang-cross[asset_pattern=x86_64-unknown-linux-musl.tar.xz,strip_components=0,bin_path=x86_64-unknown-linux-musl/bin,checksum=sha256:$TOOLCHAIN_SHA256]@$TOOLCHAIN_RELEASE"
        root="$(mise where github:cross-tools/clang-cross)/x86_64-unknown-linux-musl"
        {
          echo "RUVIA_MUSL_ROOT=$root"
          echo "FLEXEDGE_MUSL_ROOT=$root"
          echo "CC=$root/bin/x86_64-unknown-linux-musl-clang"
          echo "CXX=$root/bin/x86_64-unknown-linux-musl-clang++"
          echo "CCACHE_EXTRAFILES=$root/bin/clang"
        } >> "$GITHUB_ENV"
        {
          echo "$HOME/.local/share/mise/shims"
          echo "$root/bin"
        } >> "$GITHUB_PATH"

    - name: Show toolchain and compiler cache configuration
      shell: bash
      run: |
        cmake --version
        ninja --version
        python3 --version
        uv --version
        "$CC" --version
        "$CXX" --version
        ld.lld --version
        ccache --version
        ccache --show-config

    - name: Restore compiler cache
      if: inputs.compiler-cache != ''
      id: ccache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-v5-${{ runner.os }}-${{ runner.arch }}-clang-musl-${{ inputs.toolchain-release }}-${{ inputs.toolchain-sha256 }}-pch-${{ hashFiles('.github/actions/setup-build/action.yml', 'cmake/llvm.cmake', 'cmake/triplets/x64-linux-musl.cmake') }}-${{ env.BUILD_TYPE }}-${{ inputs.compiler-cache }}-${{ github.sha }}
        restore-keys: |
          ccache-v5-${{ runner.os }}-${{ runner.arch }}-clang-musl-${{ inputs.toolchain-release }}-${{ inputs.toolchain-sha256 }}-pch-${{ hashFiles('.github/actions/setup-build/action.yml', 'cmake/llvm.cmake', 'cmake/triplets/x64-linux-musl.cmake') }}-${{ env.BUILD_TYPE }}-${{ inputs.compiler-cache }}-

    - name: Restore vcpkg binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-clang-musl-${{ inputs.toolchain-release }}-${{ inputs.toolchain-sha256 }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', '.github/actions/setup-build/action.yml', 'cmake/llvm.cmake', 'cmake/triplets/x64-linux-musl.cmake') }}
        restore-keys: |
          vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-clang-musl-${{ inputs.toolchain-release }}-${{ inputs.toolchain-sha256 }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('.github/actions/setup-build/action.yml', 'cmake/llvm.cmake', 'cmake/triplets/x64-linux-musl.cmake') }}-
          vcpkg-binaries-${{ runner.os }}-${{ runner.arch }}-clang-musl-${{ inputs.toolchain-release }}-${{ inputs.toolchain-sha256 }}-

    - name: Bootstrap vcpkg
      shell: bash
      env:
        VCPKG_COMMIT: ${{ inputs.vcpkg-commit }}
      run: |
        set -euo pipefail
        [[ "$VCPKG_COMMIT" =~ ^[[:xdigit:]]{40}$ ]]
        mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
        git init "$VCPKG_ROOT"
        git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
        git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT"
        git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
        env -u CC -u CXX bash "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
