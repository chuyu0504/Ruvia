name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "cmake/**"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "README.md"
      - "AGENTS.md"
      - "STYLE.md"
      - ".clang-format"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "cmake/**"
      - "ruvia-core/**"
      - "ruvia-http/**"
      - "ruvia-web/**"
      - "examples/**"
      - "tests/**"
      - "README.md"
      - "AGENTS.md"
      - "STYLE.md"
      - ".clang-format"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  style:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install clang-format 21
        run: |
          python3 -m pip install --user clang-format==21.1.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.h' '*.hpp' '*.inl' '*.cpp')
          printf '%s\0' "${files[@]}" | xargs -0 -n 80 clang-format --dry-run --Werror

  linux_build:
    name: Linux
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      BUILD_TYPE: Debug
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build curl zip unzip tar pkg-config bison flex
      - name: Bootstrap latest vcpkg
        id: vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "commit=$(git -C "$VCPKG_ROOT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore vcpkg binary cache
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-gcc13-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-gcc13-
      - name: Configure
        id: configure
        run: |
          # vcpkg installs during configure; restored archives skip port builds.
          before=$(find "$VCPKG_DEFAULT_BINARY_CACHE" -type f | wc -l)
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DRUVIA_ENABLE_MARIADB=ON -DRUVIA_ENABLE_POSTGRESQL=ON \
            -DRUVIA_ENABLE_REDIS=ON -DRUVIA_ENABLE_JWT=ON \
            -DRUVIA_BUILD_EXAMPLES=ON -DRUVIA_BUILD_TESTS=ON
          after=$(find "$VCPKG_DEFAULT_BINARY_CACHE" -type f | wc -l)
          echo "new-binaries=$([ "$after" -gt "$before" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Save vcpkg binary cache
        if: github.ref == 'refs/heads/main' && steps.restore-vcpkg-cache.outputs.cache-hit != 'true' && steps.configure.outputs.new-binaries == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.restore-vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build build --config "$BUILD_TYPE" -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config "$BUILD_TYPE"
  windows_build:
    name: Windows
    runs-on: windows-2025
    env:
      BUILD_TYPE: Debug
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Bootstrap latest vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "commit=$(git -C $env:VCPKG_ROOT rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg binary cache
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-msvc-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-msvc-
      - name: Configure
        id: configure
        shell: pwsh
        run: |
          # vcpkg installs during configure; restored archives skip port builds.
          $before = (Get-ChildItem -Recurse -File $env:VCPKG_DEFAULT_BINARY_CACHE).Count
          cmake -S . -B build `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
            -DRUVIA_ENABLE_MARIADB=ON -DRUVIA_ENABLE_POSTGRESQL=ON `
            -DRUVIA_ENABLE_REDIS=ON -DRUVIA_ENABLE_JWT=ON `
            -DRUVIA_BUILD_EXAMPLES=ON -DRUVIA_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $after = (Get-ChildItem -Recurse -File $env:VCPKG_DEFAULT_BINARY_CACHE).Count
          "new-binaries=$(($after -gt $before).ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Save vcpkg binary cache
        if: github.ref == 'refs/heads/main' && steps.restore-vcpkg-cache.outputs.cache-hit != 'true' && steps.configure.outputs.new-binaries == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.restore-vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE "-j$([Environment]::ProcessorCount)"
      - name: Test
        shell: pwsh
        run: ctest --test-dir build --build-config $env:BUILD_TYPE --output-on-failure
