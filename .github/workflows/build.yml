name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_FORCE_SYSTEM_BINARIES: '1'
  VCPKG_TARGET_TRIPLET: x64-linux-musl
  VCPKG_HOST_TRIPLET: x64-linux-musl
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/triplets
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: pch_defines,time_macros

jobs:
  style:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Ruvia
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5.2.1
        with:
          install: false
          cache: false
      - name: Install latest clang-format with mise
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise use --global uv@latest "pipx:clang-format@latest"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - name: Check formatting
        run: |
          set -euo pipefail
          clang-format --version
          mapfile -t files < <(git ls-files '*.h' '*.hpp' '*.inl' '*.cpp')
          printf '%s\0' "${files[@]}" | xargs -0 -n 80 clang-format --dry-run --Werror

  resolve_toolchain:
    name: Resolve latest LLVM musl toolchain and vcpkg
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      sha256: ${{ steps.resolve.outputs.sha256 }}
      vcpkg_commit: ${{ steps.resolve.outputs.vcpkg_commit }}
    steps:
      - name: Resolve latest toolchain release, checksum, and vcpkg commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh api repos/cross-tools/clang-cross/releases/latest)"
          release="$(jq -er '.tag_name' <<< "$release_json")"
          [[ "$release" =~ ^[A-Za-z0-9._-]+$ ]]
          asset=x86_64-unknown-linux-musl.tar.xz
          jq -e --arg name "$asset" '.assets | any(.name == $name)' <<< "$release_json" > /dev/null
          jq -e --arg name "$asset.sha256" '.assets | any(.name == $name)' <<< "$release_json" > /dev/null
          checksum="$(curl -fsSL "https://github.com/cross-tools/clang-cross/releases/download/$release/$asset.sha256")"
          read -r sha256 _ <<< "$checksum"
          [[ "$sha256" =~ ^[[:xdigit:]]{64}$ ]]
          vcpkg_commit="$(gh api repos/microsoft/vcpkg/commits/HEAD --jq '.sha')"
          [[ "$vcpkg_commit" =~ ^[[:xdigit:]]{40}$ ]]
          printf 'release=%s\nsha256=%s\nvcpkg_commit=%s\n' "$release" "${sha256,,}" "${vcpkg_commit,,}" >> "$GITHUB_OUTPUT"

  ubuntu_build:
    name: Musl
    needs: resolve_toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Ruvia
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup musl build
        id: setup
        uses: ./.github/actions/setup-build
        with:
          toolchain-release: ${{ needs.resolve_toolchain.outputs.release }}
          toolchain-sha256: ${{ needs.resolve_toolchain.outputs.sha256 }}
          vcpkg-commit: ${{ needs.resolve_toolchain.outputs.vcpkg_commit }}
          compiler-cache: ruvia

      - name: Configure Release
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRUVIA_ENABLE_MARIADB=ON \
            -DRUVIA_ENABLE_POSTGRESQL=ON \
            -DRUVIA_ENABLE_REDIS=ON \
            -DRUVIA_ENABLE_JWT=ON \
            -DRUVIA_BUILD_EXAMPLES=ON \
            -DRUVIA_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/llvm.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_HOST_TRIPLET="$VCPKG_HOST_TRIPLET" \
            -DVCPKG_OVERLAY_TRIPLETS="$VCPKG_OVERLAY_TRIPLETS" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Save shared vcpkg binary cache
        if: ${{ !cancelled() && steps.setup.outputs.vcpkg-cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.setup.outputs.vcpkg-cache-key }}

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build/ci --parallel "$(nproc)"
          ccache --show-stats

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error --build-config "$BUILD_TYPE"

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.setup.outputs.compiler-cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.setup.outputs.compiler-cache-key }}

  ci_history_cleanup:
    name: CI history cleanup
    needs: [style, ubuntu_build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep the current verified build
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...repo, per_page: 100,
            });
            // All preceding jobs passed; keep this run and delete prior completed history.
            // Remove successful history last so earlier cleanup errors preserve a good build.
            const completed = runs.filter(run => run.status === 'completed' && run.id !== context.runId)
              .sort((a, b) => Number(a.conclusion === 'success') - Number(b.conclusion === 'success')
                || Date.parse(a.updated_at) - Date.parse(b.updated_at));
            let removed = 0;
            for (const run of completed) {
              const { data: current } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: run.id });
              if (current.status !== 'completed' || current.run_attempt !== run.run_attempt) continue;
              await github.rest.actions.deleteWorkflowRun({ ...repo, run_id: current.id });
              removed++;
            }
            core.notice(`Retained verified Build ${context.runId}; deleted ${removed} completed runs. Active runs were untouched.`);
